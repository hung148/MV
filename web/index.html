<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">

  <!-- SEO -->
  <meta name="description" content="MV Manufacturing LLC offers precision CNC machining and manufacturing services in Santa Clara, CA. Aerospace, medical, automotive, and industrial parts.">
  <meta name="keywords" content="CNC machining, precision manufacturing, CNC milling, CNC turning, Santa Clara, aerospace machining, medical machining">
  <meta name="robots" content="index, follow">

  <!-- Open Graph -->
  <meta property="og:title" content="MV Manufacturing LLC | CNC & Precision Manufacturing">
  <meta property="og:description" content="Precision CNC machining and manufacturing in Santa Clara, CA.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://www.mvmachineshop.com">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="mv">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>MV Manufacturing LLC</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script src="https://www.gstatic.com/firebasejs/11.3.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/11.3.0/firebase-firestore-compat.js"></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
